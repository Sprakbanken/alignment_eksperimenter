name: Run tests with pytest

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '3.11'

      - name: Run pytest
        env:
          UV_PYPROJECT_DEV_DEPENDENCIES: '1'
        run: uv run pytest
